name: MantiCollect Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to package into Draft Release (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-package:
    name: Build & Package Windows Release
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve-tag.outputs.release_tag }}
      target_commit: ${{ steps.resolve-tag.outputs.target_commit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Resolve and validate target release tag and commit
        id: resolve-tag
        shell: pwsh
        run: |
          # 1. Determine target tag from triggering event
          $targetTag = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}"
          } else {
            "${{ inputs.release_tag }}".Trim()
          }

          if (-not $targetTag.StartsWith("v")) {
            Write-Error "Invalid tag format '$targetTag'. Tags must start with 'v' (e.g. v0.1.0)."
            exit 1
          }

          Write-Host "Fetching tags from remote origin..."
          git fetch --tags origin

          # 2. Verify target tag exists remotely on origin and resolve its target commit
          $tagCommit = (git rev-list -n 1 "refs/tags/$targetTag" 2>$null)
          if (-not $tagCommit) {
            Write-Error "Target tag '$targetTag' does not exist in repository git history on origin!"
            exit 1
          }
          Write-Host "Target tag '$targetTag' points to commit $tagCommit on origin."

          # 3. Check out the EXACT commit referenced by the tag for building
          Write-Host "Checking out exact tagged source commit: $tagCommit..."
          git checkout $tagCommit
          $checkedOutCommit = (git rev-parse HEAD).Trim()
          if ($checkedOutCommit -ne $tagCommit) {
            Write-Error "Checkout failed! Expected $tagCommit, currently at $checkedOutCommit"
            exit 1
          }
          Write-Host "✓ Checked out source commit $checkedOutCommit for building."

          # 4. Validate package.json at the checked-out commit
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkgVersion = $pkg.version
          $expectedTag = "v$pkgVersion"
          if ($targetTag -ne $expectedTag) {
            Write-Error "Tag mismatch! Target tag '$targetTag' does not match package.json version '$expectedTag' at commit $tagCommit."
            exit 1
          }
          Write-Host "✓ Verified: Target tag $targetTag matches package.json version $pkgVersion at commit $tagCommit"

          # 5. Check for duplicate release on GitHub
          $releaseExists = $false
          try {
            gh release view $targetTag --repo ${{ github.repository }} 2>$null
            if ($LASTEXITCODE -eq 0) {
              $releaseExists = $true
            }
          } catch {
            $releaseExists = $false
          }

          if ($releaseExists) {
            Write-Error "A release for tag '$targetTag' already exists on GitHub! Aborting build to prevent duplicate releases."
            exit 1
          }
          Write-Host "✓ Verified: No existing release for $targetTag on ${{ github.repository }}."

          # 6. Export outputs for subsequent steps and publish job
          "release_tag=$targetTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "target_commit=$tagCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Verify branding assets and generate icons
        run: node scripts/generate-icons.mjs

      - name: Package browser extension
        run: node scripts/package-extension.mjs

      - name: Verify repository hygiene and links
        run: npm run verify

      - name: Run automated test suite
        run: npm test

      - name: Build Next.js static production export
        run: npm run build

      - name: Run Electron startup smoke test
        run: node scripts/smoke.mjs

      - name: Clean stale release build artifacts
        run: node scripts/clean-release.mjs

      - name: Package Windows NSIS installer
        env:
          # Authenticode Code Signing credentials (if configured in repo secrets)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Verify installer and extension artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release/MantiCollect-Setup-*.exe -File | Select-Object -First 1
          if (-not $installer -or $installer.Length -eq 0) {
            Write-Error "Expected non-empty MantiCollect-Setup-*.exe was not found in release/!"
            exit 1
          }
          Write-Host "Verified installer: $($installer.FullName) ($($installer.Length) bytes)"

          $extensionZip = Get-ChildItem -Path release/manticollect-browser-extension-*.zip -File | Select-Object -First 1
          if (-not $extensionZip -or $extensionZip.Length -eq 0) {
            Write-Error "Expected non-empty manticollect-browser-extension-*.zip was not found in release/!"
            exit 1
          }
          Write-Host "Verified browser extension package: $($extensionZip.FullName) ($($extensionZip.Length) bytes)"

      - name: Generate SHA-256 checksums manifest
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release/MantiCollect-Setup-*.exe -File | Select-Object -First 1
          $extensionZip = Get-ChildItem -Path release/manticollect-browser-extension-*.zip -File | Select-Object -First 1
          if (-not $installer -or $installer.Length -eq 0) {
            Write-Error "Missing or empty installer!"
            exit 1
          }
          if (-not $extensionZip -or $extensionZip.Length -eq 0) {
            Write-Error "Missing or empty extension package!"
            exit 1
          }

          $distributables = @($installer, $extensionZip)
          $checksums = foreach ($file in $distributables) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksumFile = "release/SHA256SUMS.txt"
          $checksums | Set-Content -Path $checksumFile -Encoding UTF8
          Write-Host "Generated $checksumFile :"
          Get-Content $checksumFile

      - name: Upload distributable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manticollect-release-artifacts
          path: |
            release/MantiCollect-Setup-*.exe
            release/manticollect-browser-extension-*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-draft-release:
    name: Publish Draft GitHub Release
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository at target release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-package.outputs.target_commit }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: manticollect-release-artifacts
          path: release

      - name: Recalculate and verify SHA-256 checksums
        shell: pwsh
        run: |
          Write-Host "Recalculating SHA-256 checksums and verifying against SHA256SUMS.txt..."
          $checksumFile = "release/SHA256SUMS.txt"
          if (-not (Test-Path $checksumFile)) {
            Write-Error "SHA256SUMS.txt manifest missing from downloaded artifacts!"
            exit 1
          }

          $lines = Get-Content $checksumFile | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($lines.Count -eq 0) {
            Write-Error "SHA256SUMS.txt manifest is empty!"
            exit 1
          }

          $verifiedFiles = @()
          foreach ($line in $lines) {
            $parts = -split $line
            $expectedHash = $parts[0].Trim().ToLowerInvariant()
            $filename = $parts[1].Trim()
            $filePath = Join-Path "release" $filename

            if (-not (Test-Path $filePath)) {
              Write-Error "Artifact listed in checksum manifest not found on disk: $filename"
              exit 1
            }

            $actualHash = (Get-FileHash -Path $filePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) {
              Write-Error "Checksum mismatch for $filename! Expected: $expectedHash, Calculated: $actualHash"
              exit 1
            }
            $verifiedFiles += $filePath
            Write-Host "✓ Verified $filename : $actualHash"
          }

          if ($verifiedFiles.Count -lt 2) {
            Write-Error "Fewer than 2 verified release artifacts were validated!"
            exit 1
          }
          Write-Host "All $($verifiedFiles.Count) artifacts verified against checksum manifest."

      - name: Create Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $TAG_NAME = "${{ needs.build-and-package.outputs.release_tag }}"
          $TARGET_COMMIT = "${{ needs.build-and-package.outputs.target_commit }}"

          # Verify no release already exists on GitHub for this tag
          $existingRelease = gh release view $TAG_NAME --repo ${{ github.repository }} 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Error "A release for tag '$TAG_NAME' already exists on GitHub! To prevent accidental overwrites, release creation aborted."
            exit 1
          }

          $installer = Get-ChildItem -Path release/MantiCollect-Setup-*.exe -File | Select-Object -First 1
          $extension = Get-ChildItem -Path release/manticollect-browser-extension-*.zip -File | Select-Object -First 1
          $checksumManifest = "release/SHA256SUMS.txt"
          $isSigned = if ("${{ secrets.CSC_LINK }}" -ne "") { "Signed with Authenticode certificate" } else { "Unsigned development build (verify SHA-256 checksum)" }

          $releaseNotes = @"
          ## MantiCollect $TAG_NAME — A Mantitup Product

          Local-first universal media downloader, format converter, and digital collector for Windows.

          ### Included Distributables
          - **$($installer.Name)**: Windows NSIS desktop installer (per-user `%LOCALAPPDATA%\Programs\MantiCollect`).
          - **$($extension.Name)**: Manifest V3 browser extension for Google Chrome and Microsoft Edge.
          - **SHA256SUMS.txt**: SHA-256 integrity checksum manifest.

          ### Security & Integrity
          - **Commit Target**: $TARGET_COMMIT
          - **Authenticode Status**: $isSigned
          - **Platform Compatibility**: Tested and verified on Windows 10/11 x64 (macOS and Linux are not officially validated).
          - **Integrity Verification**: Compare downloaded files with `SHA256SUMS.txt` prior to installation.

          *Note: This release is created as a draft for maintainer review. Publication requires explicit manual approval.*
          "@

          Write-Host "Creating draft release for $TAG_NAME (commit $TARGET_COMMIT) via GitHub CLI on repo ${{ github.repository }}..."
          gh release create $TAG_NAME `
            $installer.FullName `
            $extension.FullName `
            $checksumManifest `
            --repo ${{ github.repository }} `
            --target $TARGET_COMMIT `
            --verify-tag `
            --title "MantiCollect $TAG_NAME" `
            --draft `
            --notes $releaseNotes

          Write-Host "✓ Draft release created successfully on ${{ github.repository }} for $TAG_NAME"
